<body>
<main class="app" id="app">
  <header class="topbar"><div class="logo">RALLY<b>11</b><span>POWER SWING · V6</span></div><div class="iconBtns"><button type="button" class="iconBtn" id="soundBtn" aria-label="音のオンオフ">♪</button><button type="button" class="iconBtn" id="pauseBtn" aria-label="一時停止">Ⅱ</button></div></header>
  <section class="scorebar" aria-label="スコア"><div class="scoreCard you"><div><div class="playerName">YOU</div><div class="setDots" id="yourSets"><i></i><i></i></div></div><div class="points" id="yourScore">0</div></div><div class="middleScore"><strong id="gameNum">GAME 1</strong><small id="serveLabel">11 POINTS</small></div><div class="scoreCard cpu"><div class="points" id="cpuScore">0</div><div><div class="playerName">CPU</div><div class="setDots" id="cpuSets"><i></i><i></i></div></div></div></section>
  <section class="stage" aria-label="卓球コート"><canvas id="court"></canvas><div class="stageTop"><div class="modePill" id="difficultyPill">LEVEL / NORMAL</div><div class="rallyPill">RALLY <b id="rallyCount">0</b></div></div><div class="banner hidden" id="banner"></div><div class="hint" id="hint">指でラケットを動かしてボールを打ち返そう</div></section>
  <div class="motionBar" aria-live="polite">
    <div class="motionGuide"><span class="motionGlyph">↕</span><div><strong>指で直接スイング</strong><small>上へ素早く振る＝強打 ／ 下へ引く＝後退</small></div></div>
    <div class="motionResult"><span class="motionState" id="spinLabel">フラット</span><strong id="spinPower">—</strong><small id="depthLabel" style="color:#67879b;font-size:9px;white-space:nowrap">台の近く</small></div>
  </div>
  <div class="footer">前に速く振るほど高速ショット ／ 後退ラリー＆カメラ自動追尾</div>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
</main>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id), cvs=$('court'), ctx=cvs.getContext('2d'), overlay=$('overlay'), modal=$('modal');
const scoreYou=$('yourScore'),scoreCpu=$('cpuScore'),gameNum=$('gameNum'),serveLabel=$('serveLabel'),banner=$('banner'),hint=$('hint');
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a);
const levels={easy:{name:'EASY',cpuSpeed:1.55,accuracy:.43,returnDur:1.00,reach:.44,aim:.48},normal:{name:'NORMAL',cpuSpeed:1.98,accuracy:.22,returnDur:.83,reach:.46,aim:.62},hard:{name:'PRO',cpuSpeed:2.60,accuracy:.08,returnDur:.71,reach:.48,aim:.83}};
let difficulty='normal',settings=levels.normal,W=390,H=530,dpr=1,gameState='menu',wasPaused='ready',points={you:0,cpu:0},sets={you:0,cpu:0},gameIndex=1,serve='you',rally=0,best=0,totalHits=0,aiAngle=18,muted=false,audio=null,shot=null,ball={x:0,z:.9,y:.18},trail=[],particles=[],aiX=0,playerX=0,targetPlayerX=0,playerY=.18,targetPlayerY=.18,playerZ=1.07,targetPlayerZ=1.07,aiZ=-1.07,dragStartY=0,dragStartZ=1.07,playerVel=0,strokeX=0,strokeY=0,lastStroke=0,spinReadout=0,pointerDown=false,pointerId=null,keyDir=0,keyVert=0,pointTime=0,pointMessage='',pointSub='',elapsed=0,aiServeTimer=0,last=0,glowPulse=0,flyaway=null,followCam={x:0,y:0,zoom:1},gestureSamples=[],flickVector=null;
// ラケットの実際の移動速度を衝突時にサンプリングする。
function swingSpin(vx,vy){return {top:clamp(vy*.31,-1,1),side:clamp(vx*.19,-.86,.86),power:clamp(Math.hypot(vx*.16,vy*.19),0,1)};}
// 最新130msのフリックを記録。前（画面上方向）への速いスイングは球速へ強く反映する。
function recordFlick(e){
 const now=performance.now(),r=cvs.getBoundingClientRect();
 gestureSamples.push({x:e.clientX-r.left,y:e.clientY-r.top,t:now});
 while(gestureSamples.length>2&&now-gestureSamples[0].t>130)gestureSamples.shift();
 if(gestureSamples.length<2)return;
 const first=gestureSamples[0],last=gestureSamples[gestureSamples.length-1];
 const dt=Math.max(.016,(last.t-first.t)/1000);
 const vx=(last.x-first.x)/dt,vy=(last.y-first.y)/dt;
 if(Math.hypot(vx,vy)<135||Math.hypot(last.x-first.x,last.y-first.y)<9)return;
 const side=clamp(vx/(W*1.35),-1,1),depth=clamp(-vy/(H*1.10),-1,1);
 // すばやく『前へ』振るほど強打。左右・後ろへのフリックではブーストしない。
 // 速度は画面高さを基準に正規化し、大小のiPhoneで操作感を揃える。
 const forwardPower=clamp((Math.max(0,-vy)-H*.22)/(H*1.6),0,1);
 flickVector={side,depth,power:clamp(Math.hypot(side,depth),.12,1),forwardPower,at:now};
}
function recentFlick(){return flickVector&&performance.now()-flickVector.at<850?flickVector:null;}
function updateSpinReadout(top=0,side=0,speedRatio=1){const strength=Math.max(Math.abs(top),Math.abs(side));$('spinLabel').textContent=strength<.14?'フラット':Math.abs(side)>Math.abs(top)*1.25?'横回転':top>0?'トップスピン':'バックスピン';$('spinPower').textContent=speedRatio>=1.17?`⚡ POWER ×${speedRatio.toFixed(1)}`:strength<.14?'—':`${Math.round(strength*100)}%`;}

try{best=Number(localStorage.getItem('rally11_best')||0)}catch{}
function sound(freq=300,dur=.05,type='sine',gain=.07){if(muted)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio=audio||new C();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(50,freq*.62),audio.currentTime+dur);g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
// 短い高域のアタック＋空洞の共鳴を重ねた、木製ラケット風の「カコン」。
function woodKnock(kind='racket',intensity=1){
 if(muted)return;
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  audio=audio||new C();if(audio.state==='suspended')audio.resume();
  const now=audio.currentTime,volume=Math.max(.2,Math.min(1.3,intensity));
  const racket=kind==='racket',base=racket?355:255;
  const noiseLength=Math.floor(audio.sampleRate*.065),buf=audio.createBuffer(1,noiseLength,audio.sampleRate);
  const pcm=buf.getChannelData(0);for(let i=0;i<noiseLength;i++)pcm[i]=Math.random()*2-1;
  const n=audio.createBufferSource();n.buffer=buf;
  const filter=audio.createBiquadFilter();filter.type='bandpass';filter.frequency.value=racket?1550:980;filter.Q.value=.8;
  const ng=audio.createGain();ng.gain.setValueAtTime(.0001,now);ng.gain.linearRampToValueAtTime(.08*volume,now+.001);
  ng.gain.exponentialRampToValueAtTime(.0001,now+(racket?.050:.060));
  n.connect(filter);filter.connect(ng);ng.connect(audio.destination);n.start(now);n.stop(now+.067);
  for(const [freq,amp,decay] of [[base,.115,.085],[base*1.93,.040,.043]]){
   const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';
   osc.frequency.setValueAtTime(freq,now);osc.frequency.exponentialRampToValueAtTime(freq*.77,now+decay);
   gain.gain.setValueAtTime(.0001,now);gain.gain.linearRampToValueAtTime(amp*volume,now+.002);
   gain.gain.exponentialRampToValueAtTime(.0001,now+decay);
   osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+decay+.004);
  }
 }catch{}
}

function launch(from,startX,style='drive'){
 const to=from==='you'?'cpu':'you',flick=from==='you'?recentFlick():null;
 const motion=swingSpin(strokeX,strokeY);
 const spin=from==='you'?(flick?{top:clamp(flick.depth*.84+motion.top*.16,-1,1),side:clamp(flick.side*.88+motion.side*.12,-1,1),power:flick.power}:motion):{top:(style==='cut'?-.42:.43)+rand(-.16,.16),side:rand(-.35,.35),power:.46};

 // 前へのスイングを球速の主因にする。素振りが遅い時は従来に近いラリー速度。
 const forwardBoost=from==='you'?(flick?flick.forwardPower:clamp(Math.max(0,strokeY)*.12,0,.18)):0;
 if(from==='cpu')aiAngle=top*28;
 const fromZ=from==='you'?playerZ:aiZ;
 let landing,toZ;
 if(from==='you'){
   landing=flick?clamp(flick.side*.91-aiX*.09+rand(-.035,.035),-1.08,1.08):clamp(-aiX*.38+side*.28+rand(-.07,.07),-.88,.88);
   const depth=flick?flick.depth:clamp(strokeY*.18,-1,1);
   // 正面へ強くフリックすると相手の後陣まで届く球になる。
   toZ=-clamp(1.05+depth*.47+strength*.33+forwardBoost*.22+.17*Math.max(0,playerZ-1.1),.90,2.34);
 }else{
   let sideAim=Math.random()<.5?-1:1;
   if(Math.random()<.65)sideAim=playerX>.18?-1:playerX<-.18?1:sideAim;
   landing=clamp(sideAim*rand(.22,settings.aim)+rand(-.09,.09),-.94,.94);
   // スピードのある深い返球・大きく弾む返球を混ぜ、台から下がる展開を作る。
   const r=Math.random(),depth=r<.22?rand(1.76,2.21):r<.54?rand(1.37,1.76):rand(1.03,1.36);
   toZ=depth;
 }
 const travel=Math.abs(toZ-fromZ);
 // 深いラリーでも時間をかけ過ぎず、高速ショットは明確に速くする。
 const normalDur=Math.max(.58,(from==='you'?.72:settings.returnDur)*(1-top*.08-strength*.07)+Math.max(0,travel-2.1)*.17-Math.min(rally,16)*.003);

 const dur=from==='you'?Math.max(.35,normalDur/(1+forwardBoost*1.02)):normalDur;
 const speedRatio=from==='you'?normalDur/dur:1;

 if(from==='you')flickVector=null;
 hideBanner();gameState='rally';rally++;totalHits++;scoreText();
 woodKnock('racket',from==='you'?1.00+forwardBoost*.32:.93);
 if(from==='you'&&forwardBoost>.52)makeBurst(ball,'#f2a12d',9);
 if(from==='you'){
   updateSpinReadout(top,side,speedRatio);spinReadout=1.25;
   hint.textContent=forwardBoost>.55?`⚡ パワーショット！ 球速 ×${speedRatio.toFixed(1)}`:forwardBoost>.18?'前へのスイングで打球が加速！':toZ < -1.52?'強い深いボール！相手も後ろへ下がる！':top>.17?'トップスピンで前へ伸びる！':top<-.17?'バックスピンで返球！':'フリック方向へ打球！';

function ballPos(s){

 const t=clamp(s.t,0,1),b=s.bounceT,u=t/b;

 const x=mix(s.startX,s.landing,t)+Math.sin(Math.PI*t)*s.curve;
 let y;
 if(t<=b){const height=.41-s.top*.17;y=.16*(1-u)+height*4*u*(1-u)}
 else {const v=(t-b)/(1-b);y=.16*v+(.13-s.top*.065)*Math.sin(Math.PI*v)}

function movePaddle(dt){

   const assist=pointerDown?.08:.42;
   desiredZ=mix(desiredZ,shot.toZ,assist);

function updateCamera(dt){

 const offX=Math.max(0,Math.abs(ball.x)-.76);

}
function drawPaddle(x,from){const near=from==='you',z=near?playerZ:aiZ,p=project(x,z,near?playerY:.18),r=(near?W*.055:W*.035)*followCam.zoom;const ry=r*.84;
 ctx.save();ctx.translate(p.x,p.y);ctx.rotate((near?clamp(strokeY*11+strokeX*5,-30,30):aiAngle)*Math.PI/180*.95);
 ctx.shadowColor='#264f7070';ctx.shadowBlur=13;ctx.shadowOffsetY=9;
 roundRect(-r*.21,ry*.42,r*.42,ry*.99,4,near?'#c49c7c':'#be8f67');ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 ctx.beginPath();ctx.ellipse(0,-ry*.3,r,ry,0,0,TAU);ctx.fillStyle='#081e2b';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=near?'#087dbe':'#f86865';ctx.stroke();
 const gr=ctx.createRadialGradient(-r*.3,-ry*.65,1,0,-ry*.2,r*1.3);if(near){gr.addColorStop(0,'#75dafa');gr.addColorStop(.8,'#0ba7d8');gr.addColorStop(1,'#0874a6')}else{gr.addColorStop(0,'#ffc7ac');gr.addColorStop(.8,'#f56e70');gr.addColorStop(1,'#ba454b')}
 ctx.beginPath();ctx.ellipse(0,-ry*.3,r*.81,ry*.82,0,0,TAU);ctx.fillStyle=gr;ctx.fill();
 ctx.strokeStyle='#ffffff36';ctx.lineWidth=.8;ctx.beginPath();ctx.ellipse(-r*.18,-ry*.52,r*.45,ry*.43,-.5,3.25,5.7);ctx.stroke();ctx.restore()}
function drawBall(){
 if(gameState==='menu'||gameState==='gameover')return;
 const p=project(ball.x,ball.z,ball.y),shadow=project(ball.x,ball.z,0),r=6*p.scale;
 ctx.fillStyle='#163e6742';ctx.beginPath();ctx.ellipse(shadow.x,shadow.y+2,r*1.45,r*.40,0,0,TAU);ctx.fill();
 const sv=shot?shot.top:(flyaway?clamp(strokeY*.31,-1,1):0);
 const rush=shot?.from==='you'?(shot.forwardBoost||0):0;
 for(let i=trail.length-1;i>=0;i--){const t=trail[i],c=project(t.x,t.z,t.y),k=clamp(t.life/.15,0,1);ctx.beginPath();ctx.arc(c.x,c.y,Math.max(1,r*k*.86),0,TAU);ctx.fillStyle=rush>.45?`rgba(245,148,24,${(.28+.27*rush)*k})`:sv>=0?`rgba(5,157,200,${.30*k})`:`rgba(246,115,62,${.30*k})`;ctx.fill()}
 const aura=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3.8);aura.addColorStop(0,'#ffe6a677');aura.addColorStop(1,'#ffe6a600');ctx.fillStyle=aura;ctx.beginPath();ctx.arc(p.x,p.y,r*3.8,0,TAU);ctx.fill();
 const g=ctx.createRadialGradient(p.x-r*.25,p.y-r*.35,0,p.x,p.y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#fff7e8');g.addColorStop(1,'#ffb84c');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.fill();ctx.lineWidth=1.3;ctx.strokeStyle='#b75b2380';ctx.stroke();
 // ボール表面の回転マーク：回転方向と速度を視覚化する。
 if(Math.abs(sv)>.08){const phase=elapsed*(11+Math.abs(sv)*26)*(sv>0?1:-1);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(phase);ctx.strokeStyle=sv>=0?'#069ec8':'#ef7045';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(0,0,r*.68,-.85,.9);ctx.stroke();ctx.restore()}
}
function drawReticle(){if(!shot||shot.to!=='you')return;const p=project(shot.landing,Math.min(1.55,shot.toZ),0),alpha=.24+.18*Math.sin(elapsed*8);ctx.strokeStyle=`rgba(236,106,49,${alpha+.18})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(p.x,p.y,16,6,0,0,TAU);ctx.stroke();ctx.beginPath();ctx.ellipse(p.x,p.y,6,2.5,0,0,TAU);ctx.stroke()}
function drawScene(){ctx.clearRect(0,0,W,H);drawBackground();drawTable();drawReticle();drawPaddle(aiX,'cpu');drawPaddle(playerX,'you');drawBall();for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill()}ctx.globalAlpha=1;
 if(gameState==='ready'&&serve==='you'){const p=project(playerX,playerZ,playerY);ctx.strokeStyle=`rgba(8,147,189,${.30+.17*Math.sin(elapsed*4)})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y,24+4*Math.sin(elapsed*4),15+3*Math.sin(elapsed*4),0,0,TAU);ctx.stroke()}}
function loop(now){let dt=Math.min((now-last)/1000||.016,.05);last=now;if(gameState!=='paused'&&gameState!=='menu'&&gameState!=='gameover')simulate(dt);drawScene();requestAnimationFrame(loop)}
function setAim(evt){
 const rect=cvs.getBoundingClientRect();
 const x=evt.clientX-rect.left,y=evt.clientY-rect.top;
 targetPlayerX=clamp((x-W/2)/(W*.49),-.99,.99);
 // タッチ開始位置からの上下移動を、手前・奥へのフットワークに変換する。
 // 下方向へドラッグ = 台から離れる。上方向へドラッグ = 台へ近づく。
 targetPlayerZ=clamp(dragStartZ+(y-dragStartY)/H*2.65,1.04,2.35);
 targetPlayerY=clamp(.18-(y-dragStartY)/H*.26,.08,.46);
}
cvs.addEventListener('pointerdown',e=>{
 e.preventDefault();if(pointerDown)return;
 pointerDown=true;pointerId=e.pointerId;gestureSamples=[];dragStartY=e.clientY-cvs.getBoundingClientRect().top;dragStartZ=targetPlayerZ;
 cvs.setPointerCapture(e.pointerId);setAim(e);recordFlick(e);
 // iOS Safariのオーディオ制限を解除するため、ユーザー操作時に音源を準備。
 if(!muted&&audio?.state==='suspended')audio.resume().catch(()=>{});
});
cvs.addEventListener('pointermove',e=>{
 if(pointerDown&&e.pointerId===pointerId){e.preventDefault();setAim(e);recordFlick(e)}
});
function releasePointer(e){
 if(e.pointerId!==pointerId)return;
 if(e.type==='pointerup'&&gameState==='ready'&&serve==='you'){
   // サーブは指を離してから。フリック方向をそのまま最初の打球に反映する。
   launch('you',playerX);
 }
 pointerDown=false;pointerId=null;gestureSamples=[];
}
cvs.addEventListener('pointerup',releasePointer);cvs.addEventListener('pointercancel',releasePointer);
window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','w','s','A','D','W','S'].includes(e.key))e.preventDefault();
 if(['ArrowLeft','a','A'].includes(e.key))keyDir=-1;
 if(['ArrowRight','d','D'].includes(e.key))keyDir=1;
 if(['ArrowUp','w','W'].includes(e.key))keyVert=1;
 if(['ArrowDown','s','S'].includes(e.key))keyVert=-1;
 if(e.key===' '&&gameState==='ready'&&serve==='you')launch('you',playerX);
 if(e.key==='Escape'&&['ready','rally','point','chase'].includes(gameState))pause();
});
window.addEventListener('keyup',e=>{
 if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key))keyDir=0;
 if(['ArrowUp','ArrowDown','w','s','W','S'].includes(e.key))keyVert=0;
});
$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'♪̸':'♪';$('soundBtn').setAttribute('aria-label',muted?'音をオン':'音をオフ')});
function pause(){if(!['ready','rally','point','chase'].includes(gameState))return;wasPaused=gameState;gameState='paused';overlay.hidden=false;$('pauseBtn').textContent='▶';modal.innerHTML=`<div class="trophy">⏸</div><div class="eyebrow">BREAK TIME</div><h1>PAUSED</h1><p>試合を一時停止中です。</p><button class="primary" id="resumeBtn">試合にもどる　▶</button><button class="secondary" id="quitBtn">タイトルへ戻る</button>`;$('resumeBtn').addEventListener('click',resume);$('quitBtn').addEventListener('click',()=>showMenu())}
function resume(){overlay.hidden=true;gameState=wasPaused;$('pauseBtn').textContent='Ⅱ'}
$('pauseBtn').addEventListener('click',()=>{if(gameState==='paused')resume();else if(gameState==='menu'||gameState==='gameover'){}else pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&['ready','rally','point','chase'].includes(gameState))pause()});
resize();scoreText();updateSpinReadout();showMenu();requestAnimationFrame(loop);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
})();
</script>
</body>
