<head>

<title>RALLY 11 — MATCH OPTIONS</title>
<style>
:root {color-scheme:dark; --ink:#eefaff;--muted:#7f9aaa;--teal:#35e0ca;--coral:#ff806f;--gold:#ffda86;--bg:#071321;--line:rgba(134,181,207,.17);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
* {box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 25%,#15324c 0%,#071321 55%,#040c16 100%)}
button{font:inherit;cursor:pointer;border:0;color:inherit;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.app{max-width:760px;margin:auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 13px calc(env(safe-area-inset-bottom) + 10px);gap:8px;position:relative}
.topbar{height:36px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding:0 4px}
.logo{font-size:16px;font-weight:1000;letter-spacing:.16em;white-space:nowrap}.logo b{color:var(--teal)}.logo span{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.16em;margin-left:9px}
.iconBtns{display:flex;gap:8px}.iconBtn{width:37px;height:34px;border:1px solid var(--line);background:#10263a;border-radius:11px;font-size:16px;display:grid;place-items:center}.iconBtn:active{transform:scale(.95)}
.scorebar{display:grid;grid-template-columns:1fr 56px 1fr;align-items:center;gap:9px;flex-shrink:0}
.scoreCard{background:linear-gradient(125deg,rgba(26,57,78,.94),rgba(13,32,49,.93));border:1px solid var(--line);border-radius:17px;display:flex;align-items:center;justify-content:space-between;padding:10px 13px;min-height:78px;gap:8px;box-shadow:0 8px 22px #0002}
.scoreCard.you{border-bottom:2px solid var(--teal)}.scoreCard.cpu{border-bottom:2px solid var(--coral)}
.playerName{font-size:10px;font-weight:800;letter-spacing:.19em;color:var(--muted);margin-bottom:3px}
.scoreCard.you .playerName{color:var(--teal)}.scoreCard.cpu .playerName{color:var(--coral)}
.points{font-size:41px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.055em;font-weight:900}
.setDots{display:none;gap:5px;margin-top:7px;min-height:7px}.setDots i{display:block;width:18px;height:5px;border-radius:10px;background:#375268}.setDots i.active.you{background:var(--teal)}.setDots i.active.cpu{background:var(--coral)}
.middleScore{text-align:center}.middleScore strong{display:block;font-size:12px;letter-spacing:.12em;color:var(--gold)}.middleScore small{font-size:9px;color:var(--muted);letter-spacing:.10em;font-weight:800}
.stage{flex:1;min-height:210px;position:relative;border-radius:20px;overflow:hidden;border:1px solid rgba(140,191,216,.14);background:#071321;isolation:isolate;box-shadow:0 18px 65px #0005}
#court{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
.stageTop{position:absolute;top:13px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;align-items:flex-start;z-index:2}
.modePill,.rallyPill{font-size:10px;font-weight:800;letter-spacing:.12em;background:#071321ba;border:1px solid #56809555;border-radius:100px;padding:8px 11px;backdrop-filter:blur(12px)}.rallyPill b{color:var(--gold);font-size:12px}
.hint{position:absolute;bottom:16px;left:12px;right:12px;text-align:center;pointer-events:none;color:#d5e8f6b6;font-size:11px;font-weight:750;letter-spacing:.025em;text-shadow:0 2px 7px #000;z-index:1}
.banner{position:absolute;top:20%;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center;z-index:3;width:92%;font-size:26px;font-weight:950;letter-spacing:.06em;color:#fff;text-shadow:0 3px 24px #000;transition:opacity .2s}.banner small{display:block;font-size:12px;color:#b6d2e3;font-weight:700;letter-spacing:.05em;margin-top:6px}.banner.hidden{opacity:0}
.controls{display:flex;align-items:stretch;gap:9px;flex-shrink:0;min-height:68px}
.shotBtn{flex:1;border:1px solid rgba(147,185,214,.18);background:#0e2638;border-radius:14px;padding:9px 10px;display:flex;gap:9px;align-items:center;text-align:left;transition:all .15s}.shotBtn.selected{background:linear-gradient(130deg,#164c58,#0e3346);border-color:#35e0ca8c;box-shadow:inset 0 0 0 1px #35e0ca26}.shotBtn.cut.selected{background:linear-gradient(130deg,#5b3549,#382d4e);border-color:#ffb2a077}.shotIcon{font-size:20px}.shotText strong{font-size:12px;display:block}.shotText small{display:block;color:#91abbc;font-size:10px;margin-top:3px}.spinBadge{align-self:center;font-size:9px;color:var(--gold);font-weight:900;letter-spacing:.08em;padding-left:3px}
.footer{color:#547283;font-size:9px;font-weight:750;letter-spacing:.09em;text-align:center;height:11px;line-height:11px;flex-shrink:0}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg,#04101ad9,#061a29ed);z-index:10;display:flex;justify-content:center;align-items:flex-start;padding:22px;backdrop-filter:blur(9px);overflow:auto}.overlay[hidden]{display:none}
.modal{margin:auto;width:min(100%,390px);border:1px solid #4c7f9950;border-radius:25px;padding:24px 21px;background:linear-gradient(145deg,#102c40,#091b2d);box-shadow:0 30px 80px #000b;text-align:center}
.trophy{width:69px;height:69px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;font-size:35px;background:#183e51;border:1px solid #53a69a52;box-shadow:0 0 35px #18bba41a}
.eyebrow{font-size:11px;letter-spacing:.28em;font-weight:900;color:var(--teal);margin:8px 0}
.modal h1{font-size:37px;line-height:1.04;letter-spacing:-.05em;margin:7px 0 10px;font-weight:950}.modal h1 em{color:var(--teal);font-style:normal}
.modal p{font-size:12px;line-height:1.85;color:#9db9ca;margin:0 0 16px}
.segment{display:flex;gap:7px;margin:10px 0 15px;text-align:center}.diff{flex:1;padding:12px 5px;font-size:11px;font-weight:850;border-radius:11px;background:#163246;color:#8eafc1;border:1px solid #45657766}.diff.active{color:#021b24;background:var(--teal);border-color:var(--teal)}
.primary{width:100%;background:linear-gradient(100deg,#38dfca,#9cf2de);color:#033035;border-radius:13px;padding:15px;font-size:14px;font-weight:950;letter-spacing:.04em;box-shadow:0 6px 27px #1fe1c129}.primary:active{transform:scale(.98)}
.secondary{margin-top:10px;background:transparent;border:1px solid #547487;color:#c6dee8;border-radius:12px;padding:11px 15px;width:100%;font-size:12px;font-weight:800}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px;text-align:left}.rule{background:#ffffff08;border-radius:9px;padding:10px;font-size:10px;color:#9bbccc;line-height:1.5}.rule strong{color:#d8f5f4;display:block;margin-bottom:3px;font-size:11px}
.resultStats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.resultStats div{background:#153448;border-radius:10px;padding:12px}.resultStats strong{font-size:21px;display:block;color:var(--gold)}.resultStats small{font-size:10px;color:#9db5c4}
@media(max-height:680px){.app{gap:5px;padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}.topbar{height:26px}.scoreCard{min-height:59px;padding:7px 10px}.points{font-size:31px}.controls{min-height:52px}.shotBtn{padding:5px 8px}.footer{display:none}.modal{padding:16px}.modal h1{font-size:30px}.modal p{line-height:1.45}}
@media(min-width:560px){.app{max-width:540px}.stage{min-height:270px}}

.banner{color:#124c6c;text-shadow:0 2px 15px #ffffff}.banner small{color:#517c96}
.angleControl{flex-shrink:0;background:#fff;border:1px solid #dce8f2;border-radius:15px;padding:9px 14px 8px;box-shadow:0 4px 18px #285c8210}

.angleEnd small{display:block;font-weight:650;color:#91a4b3;font-size:8px;white-space:nowrap}

.shotBtn.cut.selected{background:#fff2e8;border-color:#f3ac83}
.shotText small{color:#718ea2}.spinBadge{color:#c87917}.footer{color:#7b98ac;font-size:9px}

.eyebrow{color:#078aab}.modal h1 em{color:#079ab8}
.modal p{color:#6e899f}
.styleOption{flex:1;min-width:0;padding:11px 7px;border:1px solid #d6e7f1;background:#f3f8fc;color:#31546c;border-radius:12px;text-align:center}.styleOption.active{background:#dcf5fa;border-color:#0796be;box-shadow:inset 0 0 0 1px #0796be}.styleOption strong{display:block;font-size:13px}.styleOption small{display:block;font-size:10px;color:#638399;margin-top:5px}.styleChoice{display:flex;gap:8px;margin:8px 0 15px}.cpuKind{font-size:10px;font-weight:850;color:#16738d}.bounceLabel{font-size:11px;font-weight:900}
.diff{background:#f1f6f9;color:#53738a;border:1px solid #deebf2}.diff.active{background:#0796be;color:#fff;border-color:#078bb1}

.secondary{color:#427087;border-color:#bad5e4}
.rule{background:#ecf5fa;color:#6b859a}.rule strong{color:#124963}
.resultStats div{background:#e9f5fa}.resultStats strong{color:#e27f22}.resultStats small{color:#69889c}
@media(max-height:720px){.app{gap:5px}.angleControl{padding:6px 10px}.angleMeta{margin-bottom:3px}.controls{min-height:53px}.shotBtn{padding:5px 8px}}

/* MOTION SPIN: gesture-controlled paddle, no manual angle buttons */
.motionBar{display:flex;flex-shrink:0;align-items:center;justify-content:space-between;gap:9px;background:#fff;border:1px solid #dce8f1;border-radius:15px;padding:10px 12px;box-shadow:0 4px 16px #27638a10;min-height:61px}
.motionGuide{display:flex;align-items:center;gap:9px;min-width:0}
.motionGlyph{display:grid;place-items:center;width:32px;height:32px;flex-shrink:0;color:#0787b0;border-radius:10px;background:#e5f6ff;font-size:21px;font-weight:900}
.motionGuide strong{display:block;font-size:12px;color:#144767}.motionGuide small{display:block;font-size:10px;color:#66849a;line-height:1.35;margin-top:2px}
.motionResult{display:flex;flex-direction:column;align-items:flex-end;min-width:74px;gap:3px;font-variant-numeric:tabular-nums}
.motionState{font-size:11px;color:#078ba7;font-weight:900;white-space:nowrap}.motionResult strong{font-size:12px;color:#c66e23;white-space:nowrap}
@media(max-width:350px){.motionGuide small{font-size:9px}.motionBar{padding:7px 9px;min-height:50px}.motionResult{min-width:65px}}
@media(max-height:710px){.app{gap:5px}.motionBar{padding:6px 10px;min-height:48px}.stage{min-height:190px}}
/* v14: 強打・変化球の色と利き手を常時把握できる小さな凡例 */
.trailLegend{position:absolute;top:49px;left:12px;display:flex;flex-wrap:wrap;gap:7px;pointer-events:none;z-index:2}
.trailLegend span{display:flex;align-items:center;gap:4px;font-size:9px;font-weight:850;color:#28506e;padding:5px 7px;background:#ffffffdf;border:1px solid #e0edf6;border-radius:20px}
.trailLegend i{display:inline-block;width:15px;height:4px;border-radius:5px;box-shadow:0 0 6px #ffffff}
.trailLegend .blueLine{background:#188cff}.trailLegend .redLine{background:#ee4b56}
@media(max-width:350px){.trailLegend{top:44px;gap:3px}.trailLegend span{font-size:8px;padding:4px 5px}}
/* プロ大会：通常の大会と見分けられるボタン */
.proTourBtn{border-color:#efb85a;background:linear-gradient(120deg,#fff6e9,#ffe8c5);color:#8f460c;font-weight:900}
.proTourBtn:active{background:#ffe0a8}

.tourProgress{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 13px}
.tourStep{font-size:10px;font-weight:850;border:1px solid #d6e7f1;background:#edf4f9;color:#60859d;border-radius:30px;padding:7px 9px}
.tourStep.done{background:#dbf6ed;color:#087a61;border-color:#a9dfd0}.tourStep.current{background:#147db1;color:white;border-color:#147db1}
.bracketViewport{max-height:270px;overflow:auto;border:1px solid #d6e8f1;background:#f5fafe;border-radius:12px;padding:10px;margin:10px 0;text-align:left;-webkit-overflow-scrolling:touch}

/* v23: ホーム画面の3つの設定。小さなiPhoneにも収まるスイッチ */
.optionPanel{margin:9px 0 13px;padding:11px;background:#edf7fc;border:1px solid #d4e7f0;border-radius:14px;text-align:left}
.optionHeading{font-size:11px;font-weight:900;letter-spacing:.08em;color:#245573;margin:0 0 8px}
.optionToggle{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;padding:9px 8px;background:#fff;border:1px solid #dae8ef;border-radius:10px;color:#203f55;text-align:left;margin-top:6px;min-height:49px}
.optionToggle:focus-visible{outline:2px solid #0b98c0;outline-offset:2px}
.optionInfo{display:flex;flex-direction:column;min-width:0;gap:2px}
.optionInfo strong{font-size:12px;font-weight:850}
.optionInfo small{font-size:10px;color:#69869b;line-height:1.35}
.optionTrack{display:flex;align-items:center;justify-content:flex-start;width:48px;height:26px;border-radius:100px;flex-shrink:0;background:#b7c8d5;padding:3px;transition:background .15s ease}
.optionKnob{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #133d4c44;transition:transform .15s ease}
.optionToggle[aria-checked="true"] .optionTrack{background:#049dc2}
.optionToggle[aria-checked="true"] .optionKnob{transform:translateX(22px)}
@media(max-width:350px){.optionToggle{min-height:45px;padding:7px}.optionInfo small{font-size:9px}}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="topbar"><div class="logo">RALLY<b>11</b><span>MATCH OPTIONS · V23</span></div><div class="iconBtns"><button type="button" class="iconBtn" id="bracketBtn" aria-label="トーナメント表を表示" title="トーナメント表">🏆</button><button type="button" class="iconBtn" id="soundBtn" aria-label="音のオンオフ">♪</button><button type="button" class="iconBtn" id="pauseBtn" aria-label="一時停止">Ⅱ</button></div></header>
  <section class="scorebar" aria-label="スコア"><div class="scoreCard you"><div><div class="playerName">YOU</div><div class="setDots" id="yourSets"><i></i><i></i></div></div><div class="points" id="yourScore">0</div></div><div class="middleScore"><strong id="gameNum">1 SET</strong><small id="serveLabel">11 POINTS</small></div><div class="scoreCard cpu"><div class="points" id="cpuScore">0</div><div><div class="playerName" id="cpuDisplay">CPU</div><div class="setDots" id="cpuSets"><i></i><i></i></div></div></div></section>
  <section class="stage" aria-label="卓球コート"><canvas id="court"></canvas><div class="stageTop"><div class="modePill" id="difficultyPill">LEVEL / NORMAL</div><div class="rallyPill">RALLY <b id="rallyCount">0</b></div></div><div class="banner hidden" id="banner"></div><div class="trailLegend"><span><i class="blueLine"></i>ドライブ・スマッシュ</span><span><i class="redLine"></i>カット</span></div><div class="hint" id="hint">指でラケットを動かしてボールを打ち返そう</div></section>
  <div class="motionBar" aria-live="polite">
    <div class="motionGuide"><span class="motionGlyph">↕</span><div><strong>指で直接スイング</strong><small>上へ素早く＝ドライブ ／ 下へこする＝カット</small></div></div>
    <div class="motionResult"><span class="motionState" id="spinLabel">フラット</span><strong id="spinPower">—</strong><small id="depthLabel" style="color:#67879b;font-size:9px;white-space:nowrap">台の近く</small></div>
  </div>
  <div class="footer">MATCH OPTIONS v23 ・ ホーム画面から3種類のアシスト設定</div>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
</main>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id), cvs=$('court'), ctx=cvs.getContext('2d'), overlay=$('overlay'), modal=$('modal');
const scoreYou=$('yourScore'),scoreCpu=$('cpuScore'),gameNum=$('gameNum'),serveLabel=$('serveLabel'),banner=$('banner'),hint=$('hint');
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a);
// CPUは瞬間移動できない。移動速度・反応の遅れ・ラケットの届く距離を難易度で分ける。
const levels={
 easy:{name:'EASY',cpuSpeed:1.88,reaction:.21,accuracy:.18,returnDur:.98,reach:.28,depthReach:.68,aim:.40},
 normal:{name:'NORMAL',cpuSpeed:2.38,reaction:.145,accuracy:.12,returnDur:.84,reach:.26,depthReach:.64,aim:.55},
 hard:{name:'PRO',cpuSpeed:3.18,reaction:.085,accuracy:.07,returnDur:.71,reach:.25,depthReach:.58,aim:.68},

 }

function ballPos(s){
 if(!s)return ball;
 const t=clamp(s.t,0,1),b=s.bounceT,u=t/b;
 const z=mix(s.fromZ,s.toZ,t);
 // 横回転は飛行中に曲がる。飛ぶ距離に応じて偏差を増加させる。
 const x=s.sideCut
   ? (t<=b?mix(s.startX,s.bounceX,t/b)+Math.sin(Math.PI*t/b)*s.curve*.25:
      mix(s.bounceX,s.landing,(t-b)/(1-b)))
   : mix(s.startX,s.landing,t)+Math.sin(Math.PI*t)*s.curve;
 let y;
 if(t<=b){
   // 着地点まで緩やかに落ちる弾道。強く前に打っても急角度で上昇しない。
   y=.18*(1-u)+s.arcHeight*4*u*(1-u);
 }else{
   const v=(t-b)/(1-b);
   // エンドオーバーは台で跳ねない。着地後も台外へ進み、少し沈む。
   y=s.missedBy?-.10*v:.18*v+s.reboundHeight*Math.sin(Math.PI*v);
 }
 return{x,z,y};
}

function finishShot(){
 if(!shot)return;
 const s=shot;ball={x:s.landing,z:s.toZ,y:.18};
 if(s.missedBy){if(s.missType==='net'){shot=null;award('cpu',s.outReason);return;}loseBall(s.missedBy==='you'?'cpu':'you',s.outReason||'台の奥端を越えてオーバー');return}
 if(Math.abs(s.bounceX??s.landing)>1.06){loseBall(s.from==='you'?'cpu':'you','台のサイド外に落ちた！');return}
 if(s.to==='you'){
   const lateral=Math.abs(playerX-s.landing),distance=Math.abs(playerZ-s.toZ);
   // ラリー継続優先：台の手前に出た短い球も、後ろへ下がった深い球も
   // 少し離れていて返球できる「スイートスポット補正」を適用する。
   const reach=(isProTournament()?1.00:difficulty==='easy'?1.35:difficulty==='normal'?1.25:1.15)+(gameplayOptions.racketAssist?.19:0);
   const depthReach=(isProTournament()?1.28:difficulty==='easy'?1.68:difficulty==='normal'?1.56:1.40)+(gameplayOptions.racketAssist?.25:0);
   if(lateral>reach||distance>depthReach){loseBall('cpu',distance>depthReach?'前後の位置を合わせよう！':'左右の位置が合わなかった！');return}

   const sideHit=chooseStrokeSide(s.landing);makeBurst(ball,sideHit==='fore'?'#238cff':'#43a8ce',12);launch('you',s.landing,'drive',sideHit);
 }else{
   // サイドを切る球はバウンド後に外へ逃げる。最後の到達点ではなく、
   // バウンド直後の実際のボール位置で先に判定する。
   if(s.sideCut){loseBall('you','ノータッチ！ サイドを切る球にCPUが追いつかなかった');return}
   const lateral=Math.abs(aiX-s.landing),distance=Math.abs(aiZ-s.toZ);
   const effectiveReach=Math.max(.15,settings.reach+(isProTournament()&&proRallyPlan.long&&rally<proRallyPlan.target?.12:0)-cpuPressure*.065);
   if(lateral>effectiveReach){
     loseBall('you','ノータッチ！ 左右へ振り分けてCPUのラケットが届かなかった');return;
   }
   if(distance>settings.depthReach){
     loseBall('you','ノータッチ！ 前後のコースを突いてCPUが追いつけなかった');return;

}
function award(who,reason){

   sets[who]=1;scoreText();
   if(matchMode==='tournament')completeTournamentMatch(who);
   else showMenu('',true);

 }
 else{
   const isOver=reason.includes('奥端')||reason.includes('オーバー');
   pointMessage=reason.includes('ノータッチ')?'NO TOUCH!':isOver?(who==='you'?'CPU OVER!':'OVER!'):(who==='you'?'POINT!':'CPU POINT');
   pointSub=reason;

 gameState='point';pointTime=0;showBanner(pointMessage,pointSub);scoreText();hint.textContent=reason;
}

function movePaddle(dt){

 // アシストがプレイヤーの位置指定を勝手に大きく書き換えないよう補正量を制限。
 let aimX=targetPlayerX,aimZ=targetPlayerZ;
 if(gameplayOptions.racketAssist && shot?.to==='you' && !shot.missedBy && shot.t>.24){
   const remaining=clamp((shot.t-.24)/.54,0,1);
   const offsetX=shot.landing-targetPlayerX,offsetZ=shot.toZ-targetPlayerZ;
   aimX+=clamp(offsetX,-.34,.34)*remaining*.68;
   aimZ+=clamp(offsetZ,-.45,.45)*remaining*.63;

function rawProject(x,z,y=0){

 let width=half;
 if(z>1.22){const over=z-1.22;ground+=H*.225*(1-Math.exp(-over*.92));width*=1+Math.min(.20,over*.075)}
 if(z< -1.22){const over=-1.22-z;ground-=H*.092*(1-Math.exp(-over*1.15));width*=Math.max(.76,1-over*.087)}

}

 if(pointerDown&&e.pointerId===pointerId){e.preventDefault();setAim(e);recordFlick(e)}
});
function releasePointer(e){
 if(e.pointerId!==pointerId)return;
 if(e.type==='pointerup'&&gameState==='ready'&&serve==='you'){
   // サーブは指を離してから。フリック方向をそのまま最初の打球に反映する。
   launch('you',playerX);
 }
 pointerDown=false;pointerId=null;gestureSamples=[];
}
cvs.addEventListener('pointerup',releasePointer);cvs.addEventListener('pointercancel',releasePointer);
window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','w','s','A','D','W','S'].includes(e.key))e.preventDefault();
 if(['ArrowLeft','a','A'].includes(e.key))keyDir=-1;
 if(['ArrowRight','d','D'].includes(e.key))keyDir=1;
 if(['ArrowUp','w','W'].includes(e.key))keyVert=1;
 if(['ArrowDown','s','S'].includes(e.key))keyVert=-1;
 if(e.key===' '&&gameState==='ready'&&serve==='you')launch('you',playerX);
 if(e.key==='Escape'&&['ready','rally','point','chase'].includes(gameState))pause();
});
window.addEventListener('keyup',e=>{
 if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key))keyDir=0;
 if(['ArrowUp','ArrowDown','w','s','W','S'].includes(e.key))keyVert=0;
});
$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'♪̸':'♪';$('soundBtn').setAttribute('aria-label',muted?'音をオン':'音をオフ')});
function pause(){if(!['ready','rally','point','chase'].includes(gameState))return;wasPaused=gameState;gameState='paused';overlay.hidden=false;$('pauseBtn').textContent='▶';modal.innerHTML=`<div class="trophy">⏸</div><div class="eyebrow">BREAK TIME</div><h1>PAUSED</h1><p>試合を一時停止中です。</p><button class="primary" id="resumeBtn">試合にもどる　▶</button><button class="secondary" id="quitBtn">タイトルへ戻る</button>`;$('resumeBtn').addEventListener('click',resume);$('quitBtn').addEventListener('click',()=>showMenu())}
function resume(){overlay.hidden=true;gameState=wasPaused;$('pauseBtn').textContent='Ⅱ'}
$('bracketBtn').addEventListener('click',()=>{if(!tournament||matchMode!=='tournament')return;if(['ready','rally','point','chase'].includes(gameState))pause();if(gameState==='paused'){const old=modal.innerHTML;modal.insertAdjacentHTML('beforeend','<button class="secondary" id="openBracket">🏆 組み合わせを表示</button>');$('openBracket').addEventListener('click',()=>{modal.innerHTML='<div class="eyebrow">TOURNAMENT BRACKET</div>'+bracketHtml()+'<button class="primary" id="returnMatch">試合にもどる</button>'; $('returnMatch').addEventListener('click',resume)})}else showTournament()});$('pauseBtn').addEventListener('click',()=>{if(gameState==='paused')resume();else if(gameState==='menu'||gameState==='gameover'){}else pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&['ready','rally','point','chase'].includes(gameState))pause()});
resize();scoreText();updateSpinReadout();showMenu();requestAnimationFrame(loop);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
})();
</script>
