<body>
<main class="app" id="app">
  <header class="topbar"><div class="logo">RALLY<b>11</b><span>CLEAR SHOTS · V15</span></div><div class="iconBtns"><button type="button" class="iconBtn" id="soundBtn" aria-label="音のオンオフ">♪</button><button type="button" class="iconBtn" id="pauseBtn" aria-label="一時停止">Ⅱ</button></div></header>
  <section class="scorebar" aria-label="スコア"><div class="scoreCard you"><div><div class="playerName">YOU</div><div class="setDots" id="yourSets"><i></i><i></i></div></div><div class="points" id="yourScore">0</div></div><div class="middleScore"><strong id="gameNum">GAME 1</strong><small id="serveLabel">11 POINTS</small></div><div class="scoreCard cpu"><div class="points" id="cpuScore">0</div><div><div class="playerName">CPU</div><div class="setDots" id="cpuSets"><i></i><i></i></div></div></div></section>
  <section class="stage" aria-label="卓球コート"><canvas id="court"></canvas><div class="stageTop"><div class="modePill" id="difficultyPill">LEVEL / NORMAL</div><div class="rallyPill">RALLY <b id="rallyCount">0</b></div></div><div class="banner hidden" id="banner"></div><div class="trailLegend"><span><i class="blueLine"></i>ドライブ・スマッシュ</span><span><i class="redLine"></i>カット</span></div><div class="hint" id="hint">指でラケットを動かしてボールを打ち返そう</div></section>
  <div class="motionBar" aria-live="polite">
    <div class="motionGuide"><span class="motionGlyph">↕</span><div><strong>指で直接スイング</strong><small>上へ素早く＝ドライブ ／ 下へこする＝カット</small></div></div>
    <div class="motionResult"><span class="motionState" id="spinLabel">フラット</span><strong id="spinPower">—</strong><small id="depthLabel" style="color:#67879b;font-size:9px;white-space:nowrap">台の近く</small></div>
  </div>
  <div class="footer">CLEAR SHOTS v15 ・ ミス理由 ／ カット統合 ／ チャンスボール</div>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
</main>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id), cvs=$('court'), ctx=cvs.getContext('2d'), overlay=$('overlay'), modal=$('modal');
const scoreYou=$('yourScore'),scoreCpu=$('cpuScore'),gameNum=$('gameNum'),serveLabel=$('serveLabel'),banner=$('banner'),hint=$('hint');
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a);
const levels={easy:{name:'EASY',cpuSpeed:2.75,accuracy:.18,returnDur:.94,reach:1.05,aim:.40},normal:{name:'NORMAL',cpuSpeed:3.15,accuracy:.12,returnDur:.83,reach:1.03,aim:.55},hard:{name:'PRO',cpuSpeed:3.5,accuracy:.07,returnDur:.72,reach:.96,aim:.68}};
let playerHand='right',strokeSide='fore',cpuStyle='drive',difficulty='normal',settings=levels.normal,W=390,H=530,dpr=1,gameState='menu',wasPaused='ready',points={you:0,cpu:0},sets={you:0,cpu:0},gameIndex=1,serve='you',rally=0,best=0,totalHits=0,aiAngle=18,muted=false,audio=null,shot=null,ball={x:0,z:.9,y:.18},trail=[],particles=[],aiX=0,playerX=0,targetPlayerX=0,playerY=.18,targetPlayerY=.18,playerZ=.95,targetPlayerZ=.95,aiZ=-1.07,dragStartY=0,dragStartZ=.95,playerVel=0,strokeX=0,strokeY=0,lastStroke=0,spinReadout=0,pointerDown=false,pointerId=null,keyDir=0,keyVert=0,pointTime=0,pointMessage='',pointSub='',elapsed=0,aiServeTimer=0,last=0,glowPulse=0,flyaway=null,followCam={x:0,y:0,zoom:1},gestureSamples=[],flickVector=null,bounceCue=null,lastShotKind="フラット",pointHistory=[],missCue=null;
// 前に振った力と、ボールをこする動作は別の効果にする。
// 画面上方向への素早い操作は「前進するスイング」とみなし、
// ボールを不自然に打ち上げないようトップスピンは弱く制限する。
function swingSpin(vx,vy){return {top:clamp(vy*.075,-.25,.25),side:clamp(vx*.15,-.70,.70),power:clamp(Math.hypot(vx*.12,vy*.13),0,.7)};}
// 約120msのタッチ移動から瞬間的なスイング速度を求める。
function recordFlick(e){
 const now=performance.now(),r=cvs.getBoundingClientRect();
 gestureSamples.push({x:e.clientX-r.left,y:e.clientY-r.top,t:now});
 while(gestureSamples.length>2 && now-gestureSamples[0].t>120)gestureSamples.shift();
 if(gestureSamples.length<2)return;
 const first=gestureSamples[0],last=gestureSamples[gestureSamples.length-1];
 const dt=Math.max(.016,(last.t-first.t)/1000);
 const vx=(last.x-first.x)/dt,vy=(last.y-first.y)/dt;
 const dx=last.x-first.x,dy=last.y-first.y;
 if(Math.hypot(vx,vy)<145||Math.hypot(dx,dy)<9)return;
 const side=clamp(vx/(W*1.65),-1,1);
 const forward=clamp(-vy/(H*1.55),0,1);
 const backward=clamp(vy/(H*1.8),0,1);
 // 上方向へ振る=前への押し出し。上回転は弱い自然なドライブ程度。
 // 下へこする=カット。横方向へ振る=コースと横回転。
 const top=clamp(forward*.21-backward*.62,-.67,.25);
 const forwardPower=clamp((Math.max(0,-vy)-H*.18)/(H*1.50),0,1);
 flickVector={side,depth:forward-backward*.55,top,power:clamp(Math.hypot(side,forward*.75+backward*.55),.1,1),forwardPower,at:now};
}
// スイングは打球前の短い時間だけ有効。古いフリックが次の球に反映されないようにする。
function recentFlick(){return flickVector && performance.now()-flickVector.at<260?flickVector:null;}
function updateSpinReadout(top=0,side=0,speedRatio=1,kind='フラット'){const strength=Math.max(Math.abs(top),Math.abs(side));$('spinLabel').textContent=kind==='カット'?'🛡 カット':kind==='スマッシュ'?'💥 スマッシュ':kind==='ドライブ'?'⚡ ドライブ':strength<.14?'フラット':Math.abs(side)>Math.abs(top)*1.25?'横回転':top>0?'トップスピン':'バックスピン';$('spinPower').textContent=speedRatio>=1.17?`球速 ×${speedRatio.toFixed(1)}`:strength<.14?'—':`${Math.round(strength*100)}%`;}

// 右利きでは画面右側がフォア、左利きでは画面左側がフォア。
// 中央付近は直前のラケットの動きで打球面を判断する。
function chooseStrokeSide(impactX){
 const hand=playerHand==='right'?1:-1;
 const side=Math.abs(impactX-playerX)>.13?(impactX-playerX):Math.abs(impactX)>.12?impactX:(Math.abs(strokeX)>.10?strokeX:hand);
 return side*hand>=0?'fore':'back';
}
function shotTrailRGB(kind){
 if(kind==='ドライブ'||kind==='スマッシュ')return '25,128,252';
 if(kind==='カット')return '239,69,87';
 return '96,122,145';

 }

  landing=clamp(playerX*.54+sideAim*rand(.08,spread)+rand(-.035,.035),-.88,.88);

  const depth=kind==='カット'?(r<.20?rand(.85,1.10):r<.76?rand(1.13,1.57):rand(1.60,2.02)):

function ballPos(s){
 if(!s)return ball;
 const t=clamp(s.t,0,1),b=s.bounceT,u=t/b;
 const z=mix(s.fromZ,s.toZ,t);
 // 横回転は飛行中に曲がる。飛ぶ距離に応じて偏差を増加させる。
 const x=mix(s.startX,s.landing,t)+Math.sin(Math.PI*t)*s.curve;
 let y;
 if(t<=b){
   // 着地点まで緩やかに落ちる弾道。強く前に打っても急角度で上昇しない。
   y=.18*(1-u)+s.arcHeight*4*u*(1-u);
 }else{
   const v=(t-b)/(1-b);
   // エンドオーバーは台で跳ねない。着地後も台外へ進み、少し沈む。
   y=s.missedBy?-.10*v:.18*v+s.reboundHeight*Math.sin(Math.PI*v);
 }
 return{x,z,y};
}

function finishShot(){

   const lateral=Math.abs(playerX-s.landing),distance=Math.abs(playerZ-s.toZ);

   // 少し離れていて返球できる「スイートスポット補正」を適用する。
   const reach=difficulty==='easy'?1.46:difficulty==='normal'?1.32:1.18;
   const depthReach=difficulty==='easy'?1.58:difficulty==='normal'?1.42:1.28;

 targetPlayerZ=clamp(dragStartZ+(y-dragStartY)/H*3.35,.43,2.75);
 targetPlayerY=clamp(.18-(y-dragStartY)/H*.26,.08,.46);
}
cvs.addEventListener('pointerdown',e=>{
 e.preventDefault();if(pointerDown)return;
 pointerDown=true;pointerId=e.pointerId;gestureSamples=[];dragStartY=e.clientY-cvs.getBoundingClientRect().top;dragStartZ=targetPlayerZ;
 cvs.setPointerCapture(e.pointerId);setAim(e);recordFlick(e);
 // iOS Safariのオーディオ制限を解除するため、ユーザー操作時に音源を準備。
 if(!muted&&audio?.state==='suspended')audio.resume().catch(()=>{});
});
cvs.addEventListener('pointermove',e=>{
 if(pointerDown&&e.pointerId===pointerId){e.preventDefault();setAim(e);recordFlick(e)}
});
function releasePointer(e){
 if(e.pointerId!==pointerId)return;
 if(e.type==='pointerup'&&gameState==='ready'&&serve==='you'){
   // サーブは指を離してから。フリック方向をそのまま最初の打球に反映する。
   launch('you',playerX);
 }
 pointerDown=false;pointerId=null;gestureSamples=[];
}
cvs.addEventListener('pointerup',releasePointer);cvs.addEventListener('pointercancel',releasePointer);
window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','w','s','A','D','W','S'].includes(e.key))e.preventDefault();
 if(['ArrowLeft','a','A'].includes(e.key))keyDir=-1;
 if(['ArrowRight','d','D'].includes(e.key))keyDir=1;
 if(['ArrowUp','w','W'].includes(e.key))keyVert=1;
 if(['ArrowDown','s','S'].includes(e.key))keyVert=-1;
 if(e.key===' '&&gameState==='ready'&&serve==='you')launch('you',playerX);
 if(e.key==='Escape'&&['ready','rally','point','chase'].includes(gameState))pause();
});
window.addEventListener('keyup',e=>{
 if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key))keyDir=0;
 if(['ArrowUp','ArrowDown','w','s','W','S'].includes(e.key))keyVert=0;
});
$('soundBtn').addEventListener('click',()=>{muted=!muted;$('soundBtn').textContent=muted?'♪̸':'♪';$('soundBtn').setAttribute('aria-label',muted?'音をオン':'音をオフ')});
function pause(){if(!['ready','rally','point','chase'].includes(gameState))return;wasPaused=gameState;gameState='paused';overlay.hidden=false;$('pauseBtn').textContent='▶';modal.innerHTML=`<div class="trophy">⏸</div><div class="eyebrow">BREAK TIME</div><h1>PAUSED</h1><p>試合を一時停止中です。</p><button class="primary" id="resumeBtn">試合にもどる　▶</button><button class="secondary" id="quitBtn">タイトルへ戻る</button>`;$('resumeBtn').addEventListener('click',resume);$('quitBtn').addEventListener('click',()=>showMenu())}
function resume(){overlay.hidden=true;gameState=wasPaused;$('pauseBtn').textContent='Ⅱ'}
$('pauseBtn').addEventListener('click',()=>{if(gameState==='paused')resume();else if(gameState==='menu'||gameState==='gameover'){}else pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&['ready','rally','point','chase'].includes(gameState))pause()});
resize();scoreText();updateSpinReadout();showMenu();requestAnimationFrame(loop);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
